name: Build ARM64 Docker Image

on:
  workflow_dispatch: # 允许你在网页上手动点击按钮触发构建

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Export ARM64 Image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t lunatv:arm64 \
            --output type=docker,dest=lunatv_arm64.tar .

      - name: Compress image
        run: gzip lunatv_arm64.tar

      - name: Upload Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lunatv-arm64-image
          path: lunatv_arm64.tar.gz
          retention-days: 1
